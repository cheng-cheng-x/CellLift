[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "celllift"
version = "0.1.0"
description = "Three-dimensional nuclear and cell inference from single H&E sections"
requires-python = ">=3.10"
dependencies = ["numpy", "torch", "torchvision", "scipy", "pandas", "pyarrow", "PyYAML", "scikit-learn", "matplotlib", "Pillow", "lmdb", "opencv-python", "h5py", "tifffile"]

[project.optional-dependencies]
cuda = ["triton; sys_platform == 'linux'"]
preparation = ["cellpose==3.1.1.3", "scikit-image", "fastremap", "openslide-python"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["configs/*.json", "configs/*.yaml", "configs/*.yml"]
